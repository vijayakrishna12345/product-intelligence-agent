[project]
name = "product-intelligence-agent"
version = "0.1.0"
description = "Petbarn catalog intelligence assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=1.0",
    "langchain-groq>=1.0",
    "pydantic>=2.0",
    "streamlit>=1.40",
    "supabase>=2.0",
    "vaderSentiment>=3.3",
]

[dependency-groups]
dev = [
    "deepeval>=3.0",
    "httpx>=0.27",
    "playwright>=1.48",
    "pytest>=8.0",
    "python-dotenv>=1.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pia"]

[tool.uv]
default-groups = []

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.format]
quote-style = "double"
