[pytest]
pythonpath = src .
testpaths = tests
markers =
    unit: unit tests with fakes and fixtures
    eval: live DeepEval single-turn scoring
    conversation: ConversationSimulator multi-turn scoring
    integration: optional live integrations
    release: difficult-question release gate (live Groq)
addopts = -m "not eval and not integration and not conversation and not release"
